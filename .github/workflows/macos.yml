name: macOS CI

on:
  push:
    branches: [main, master]
    paths:
      - "macos/**"
      - "Assets/UniFi-256.png"
      - ".github/workflows/macos.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "macos/**"
      - "Assets/UniFi-256.png"
      - ".github/workflows/macos.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application bundle
        run: ./macos/build-app.sh

      - name: Verify application signature
        run: codesign --verify --deep --strict --verbose=2 macos/dist/UniFi-Policy-Manager.app

      - name: Package application bundle
        run: ditto -c -k --sequesterRsrc --keepParent macos/dist/UniFi-Policy-Manager.app macos/dist/UniFi-Policy-Manager-macOS.zip

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: UniFi-Policy-Manager-macOS
          path: macos/dist/UniFi-Policy-Manager-macOS.zip
          if-no-files-found: error
